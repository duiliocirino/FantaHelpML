[project]
name = "fantahelpml"
version = "0.1.0"
description = "Machine learning pipeline for Fantacalcio player evaluation, rating and expected auction price estimation. Produces BE-ready CSVs for FantaHelpBE."
authors = [
    {name = "Duilio Cirino",email = "duiliocirino99@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
